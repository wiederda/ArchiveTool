[workspace]
resolver = "2"
members = [
    "crates/archive-core",
    "crates/archive-cli",
    "crates/archive",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["ArchiveTool contributors"]

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
sevenz-rust2 = { version = "0.25", default-features = true }
tar = "0.4"
flate2 = "1"
bzip2 = "0.6"
lzma-rust2 = "0.25"
zstd = "0.13"
lz4_flex = "0.11"
eframe = "0.33"
rfd = "0.15"
